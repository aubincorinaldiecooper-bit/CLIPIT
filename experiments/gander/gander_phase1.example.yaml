server:
  mode: lean
  host: 0.0.0.0
  port: 7975
  runtime_dir: var/gander

asr:
  mode: disabled

duplex:
  checkpoint: REPLACE_GANDER_THINKER
  allow_client_video: true
  media_mode: omni
  client_video_mode: omni
  generate_audio: false

worker:
  provider: ornith
  cwd: .
  profile: full
  settings:
    base_url: REPLACE_ORNITH_BASE_URL
    model: ornith
    api_key_env: ORNITH_API_KEY
    timeout_sec: 120
    temperature: 0.2
    max_tokens: 1536

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFF8F5">
<title>gnsis</title>
<!-- Mark tier for the favicon (8). It flips to white in a dark browser theme,
     as the guideline says the Mark does on Night. -->
<link rel="icon" type="image/svg+xml" href="/assets/live/gnsis-mark.svg">
<link rel="stylesheet" href="/assets/live.css">
</head>
<body>
<main class="live" id="live" data-view="landing" data-state="idle">
  <!-- The signature gradient and one orbit: atmosphere behind everything, and
       no words on either. -->
  <div class="blobs" aria-hidden="true"></div>
  <img class="orbit" src="/assets/live/orbit.svg" alt="" aria-hidden="true">

  <header class="bar">
    <!-- In product, gnsis alone is the mark. It is served as a picture so a
         page whose script never ran still shows it; the script swaps in the
         same file inline, which is what lets it breathe and blink. -->
    <img class="mark" id="mark" src="/assets/live/gnsis-flat.svg" alt="gnsis" width="40" height="40">
  </header>

  <!-- Landing. A QR is useless on the device you would scan it with, so the
       two devices are offered different doors and neither is locked. -->
  <section class="landing" id="landing">
    <!-- The statement, in the guideline's words. Animated in word by word by
         live.js; the words live here, not in the script, so a page whose
         script never ran still says them. Sentence case in the markup and
         capitals in the style, so it is read out as a sentence. -->
    <h1 class="headline" id="headline">Let it see what you see.</h1>

    <div class="onQR">
      <figure class="qr">
        <div class="panel">
          <img src="/live/qr.svg" alt="QR code linking to this page" width="224" height="224">
        </div>
        <figcaption>Scan with your phone.</figcaption>
      </figure>
      <button class="link" id="useThis" type="button">Or use this computer's camera</button>
    </div>

    <div class="onTouch">
      <button class="action start" id="start" type="button">
        Start
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <p class="fineprint">Camera and microphone, only while the session is open.</p>
      <!-- Haptics, on by default and remembered on this phone. A real switch
           on purpose: on iOS the switch itself gives the feel it controls. -->
      <label class="setting" for="haptics">
        <span>Haptics</span>
        <input type="checkbox" switch id="haptics" checked>
      </label>
    </div>
  </section>

  <!-- Camera. -->
  <section class="camera" id="camera" hidden>
    <div class="stage">
      <video class="preview" id="preview" playsinline autoplay muted></video>
      <canvas class="scratch" id="scratch" aria-hidden="true"></canvas>
    </div>

    <div class="readout">
      <!-- Never promises sight before a frame has actually been accepted.
           The visible line morphs between messages; the plain copy beside it
           is what assistive tech reads, so nothing is announced mid-morph. -->
      <p class="status" id="status" aria-hidden="true" hidden></p>
      <span class="sr-only" id="statusText" role="status" aria-live="polite"></span>
      <p class="says" id="says"></p>
    </div>

    <div class="controls">
      <button class="action end" id="end" type="button">End</button>
    </div>
  </section>

  <!-- Asked in our own words before the browser asks in its own. On a phone a
       dismissed native prompt is hard to recover from, so it is worth saying
       what is about to be asked, and why, while refusing still costs nothing.
       The words are the guideline's own tone-of-voice examples (5). -->
  <div class="sheet" id="permission" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="askTitle">
      <h2 class="ask" id="askTitle">Camera and microphone</h2>
      <p class="askbody">Point the camera at something and talk normally.</p>
      <p class="askfine">Only while the session is open.</p>
      <button class="action start" id="allow" type="button">Allow camera and microphone</button>
      <button class="link" id="cancel" type="button">Not now</button>
    </div>
  </div>
</main>
<script src="/assets/live.js" type="module"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.6 -1.1 3.2 2.2" role="img" aria-label="">
<defs>
  <linearGradient id="o-warm" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE6B1"/>
    <stop offset="0.5" stop-color="#FFAA3D"/>
    <stop offset="1" stop-color="#FF8A5C"/>
  </linearGradient>
  <radialGradient id="o-coral" cx="0.34" cy="0.58" r="0.55">
    <stop offset="0" stop-color="#FF6676"/>
    <stop offset="0.55" stop-color="#FF6676" stop-opacity="0.75"/>
    <stop offset="1" stop-color="#FF6676" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="o-ring" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFE6B1" stop-opacity="0.35"/>
    <stop offset="0.5" stop-color="#FFE6B1"/>
    <stop offset="1" stop-color="#FFAA3D" stop-opacity="0.6"/>
  </linearGradient>
  <filter id="o-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="0.18"/></filter>
  <filter id="o-haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.035"/></filter>
  <clipPath id="o-planet"><circle r="1"/></clipPath>
  <!-- In the ring's own tilted frame: the far half sits behind the planet, the near half in front. -->
  <clipPath id="o-back"><rect x="-2" y="-2" width="4" height="2"/></clipPath>
  <clipPath id="o-front"><rect x="-2" y="0" width="4" height="2"/></clipPath>
</defs>
<!-- Glows behind: coral to the left, cream to the upper right. -->
<circle cx="-0.35" cy="0.25" r="0.95" fill="#FF6676" opacity="0.55" filter="url(#o-soft)"/>
<circle cx="0.55" cy="-0.5" r="0.85" fill="#FFE6B1" opacity="0.9" filter="url(#o-soft)"/>
<!-- Ring, far half. Glow gradient ellipse, 3.3 : 0.7, tilted -9 degrees. -->
<g transform="rotate(-9)">
  <g clip-path="url(#o-back)">
    <ellipse rx="1.65" ry="0.35" fill="none" stroke="url(#o-ring)" stroke-width="0.09" filter="url(#o-haze)" opacity="0.9"/>
    <ellipse rx="1.65" ry="0.35" fill="none" stroke="url(#o-ring)" stroke-width="0.045"/>
  </g>
</g>
<!-- Planet: the same gel as gnsis. -->
<circle r="1" fill="url(#o-warm)"/>
<circle r="1" fill="url(#o-coral)"/>
<circle r="1" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.075" clip-path="url(#o-planet)"/>
<!-- Ring, near half, with a soft contact shadow where it crosses the planet. -->
<g transform="rotate(-9)">
  <g clip-path="url(#o-front)">
    <ellipse rx="1.65" ry="0.35" fill="none" stroke="#111827" stroke-opacity="0.18" stroke-width="0.12" filter="url(#o-haze)" clip-path="url(#o-planet)" transform="translate(0 0.06)"/>
    <ellipse rx="1.65" ry="0.35" fill="none" stroke="url(#o-ring)" stroke-width="0.09" filter="url(#o-haze)" opacity="0.9"/>
    <ellipse rx="1.65" ry="0.35" fill="none" stroke="url(#o-ring)" stroke-width="0.045"/>
  </g>
</g>
</svg>

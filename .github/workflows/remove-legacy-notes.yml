name: Remove legacy notes system

on:
  push:
    branches:
      - remove-legacy-notes-system

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-legacy-notes-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply removal
        run: python scripts/remove-legacy-notes.py
      - name: Install
        run: npm ci
      - name: Verify retired runtime is gone
        run: |
          set -e
          for f in src/services/search/noteSearch.ts src/services/search/sceneIndex.ts src/worker/handlers/indexing.ts; do
            test ! -e "$f" || { echo "legacy file still exists: $f"; exit 1; }
          done
          if rg -n "enqueueIndexing|handleIndexing|QUEUE_NAMES\.indexing|INDEXING_ENABLED|INDEX_WAIT_TIMEOUT_MS|INDEX_WAIT_POLL_MS|INDEX_ANSWER_MAX_TOKENS|NOTES_PER_LOOKUP|NOTES_ANSWER_MAX_TOKENS|searchNotes\(|answerFromNotes\(|INDEX_SYSTEM_PROMPT|NOTES_SYSTEM_PROMPT|buildIndexInstruction|buildNotesBlock" src .env.example; then
            echo 'legacy notes runtime reference remains'
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Commit validated removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Remove legacy notes indexing system'
          git push origin HEAD:remove-legacy-notes-system

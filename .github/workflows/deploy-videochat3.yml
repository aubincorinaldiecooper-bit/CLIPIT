name: Deploy VideoChat3 to Modal

on:
  push:
    branches:
      - main
    paths:
      - modal/videochat3.py
      - scripts/verify-modal-videochat3.py
      - .github/workflows/deploy-videochat3.yml
  workflow_dispatch:

concurrency:
  group: deploy-videochat3-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "Missing GitHub secret MODAL_TOKEN_ID"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "Missing GitHub secret MODAL_TOKEN_SECRET"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: python -m pip install "modal==1.5.0"

      - name: Deploy VideoChat3 to Modal main
        run: modal deploy -e main modal/videochat3.py

      - name: Verify deployed VideoChat3 contract
        run: python scripts/verify-modal-videochat3.py

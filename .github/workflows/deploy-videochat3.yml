name: Deploy VideoChat3 to Modal

on:
  push:
    branches:
      - main
    paths:
      - modal/videochat3.py
      - .github/workflows/deploy-videochat3.yml
  workflow_dispatch:

concurrency:
  group: deploy-videochat3-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "Missing GitHub secret MODAL_TOKEN_ID"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "Missing GitHub secret MODAL_TOKEN_SECRET"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal CLI
        run: python -m pip install 'modal>=1.5,<2'

      - name: Deploy VideoChat3 to Modal main
        run: modal deploy -e main modal/videochat3.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify deployed contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { ModalClient } from 'modal';

          const client = new ModalClient({
            tokenId: process.env.MODAL_TOKEN_ID,
            tokenSecret: process.env.MODAL_TOKEN_SECRET,
            environment: 'main',
          });

          const cls = await client.cls.fromName('clipit-videochat3', 'VideoChat3Service');
          const instance = await cls.instance();
          const required = ['health', 'watch', 'watch_stream', 'verify_intervals'];

          for (const method of required) {
            await instance.method(method);
            console.log(`verified ${method}`);
          }

          console.log('VideoChat3 Modal contract verified in environment main');
          NODE

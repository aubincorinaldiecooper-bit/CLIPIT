name: PR130 contract validation
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 tools/repair_pr130_contract_test.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: python3 -m unittest discover -s tools/simplemem -p 'test_*.py' -v

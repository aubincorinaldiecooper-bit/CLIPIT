name: Cleanup retired retrieval residue

on:
  push:
    branches:
      - cleanup/retire-legacy-retrieval-residue

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Apply retired retrieval cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/retire-legacy-retrieval-residue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/cleanup-retired-retrieval.mjs
      - run: node scripts/cleanup-retired-retrieval-finalize.mjs
      - run: node scripts/cleanup-retired-retrieval-disabled.mjs
      - run: npm run typecheck
      - run: npm test
      - name: Verify retired runtime residue is gone
        run: |
          ! grep -R "video_scenes\|getVideoWithReadProgress\|setIndexStatus\|recordSearchApproach\|answeredFromNotes\|notesSilent\|questionsNotesCouldNotAnswer" src test --exclude-dir=migrations
          ! grep -R "'media_index'\|\"media_index\"" src --exclude-dir=migrations
          ! grep -R "indexStatus\|indexReadThroughSeconds\|sceneCount" src --exclude-dir=migrations
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply retired retrieval cleanup"
          git push origin HEAD:cleanup/retire-legacy-retrieval-residue

name: Finalize SimpleMem pre-smoke completion

on:
  push:
    branches:
      - fix/simplemem-pre-smoke-completion
    paths:
      - scripts/finalize-simplemem-pre-smoke.mjs
      - .github/workflows/finalize-simplemem-pre-smoke.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simplemem-pre-smoke-completion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply pre-smoke completion
        run: node scripts/finalize-simplemem-pre-smoke.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete SimpleMem pre-smoke fixes"
          git push origin HEAD:fix/simplemem-pre-smoke-completion

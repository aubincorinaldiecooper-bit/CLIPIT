name: Final notes-era residue cleanup

on:
  push:
    branches:
      - cleanup/retire-legacy-retrieval-residue

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Complete legacy residue cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/retire-legacy-retrieval-residue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/finalize-legacy-residue.mjs
      - run: npm run typecheck
      - run: npm test
      - name: Audit retired runtime concepts
        run: |
          ! grep -RniE "notes_consulted|answeredFromNotes|recordSearchApproach|getVideoWithReadProgress|setIndexStatus|services/mediaIndex|video_scenes|indexReadThroughSeconds|sceneCount|not_in_notes|not_read_yet" src test --exclude-dir=migrations
          ! grep -RniE "'media_index'|\"media_index\"" src test --exclude-dir=migrations
          ! grep -RniE "notes (above|below|lookup|are allowed|at upload)|notes'|notes then|notes, then" src test --exclude-dir=migrations
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete legacy residue cleanup"
          git push origin HEAD:cleanup/retire-legacy-retrieval-residue

name: Apply PR128 fencing fix

on:
  push:
    branches:
      - fix/pr128-attempt-fencing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply focused fencing patch
        run: python3 tools/apply_pr128_fencing_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Fencing tests
        run: npx vitest run test/searchFencing.test.ts
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db/repositories/clipRequests.ts src/worker/handlers/clipSearch.ts src/services/media/thumbnails.ts test/searchFencing.test.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: fence interim clip-search writes"
          git push

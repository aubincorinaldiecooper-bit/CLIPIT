name: VideoChat3 validation

on:
  push:
    branches:
      - feat/videochat3-search-stack
      - feat/videochat3-search-stack-audit
  pull_request:
    branches:
      - main
      - feat/videochat3-search-stack

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      # The SimpleMem sidecar's caption writer has no Node counterpart; its tests are plain unittest.
      - run: python3 -m unittest discover -s tools/simplemem -p 'test_*.py' -v

name: Gander validation

on:
  pull_request:
    paths:
      - 'gander/**'
      - 'modal/gander.py'
      - '.github/workflows/gander-validation.yml'
  push:
    branches:
      - chore/vendor-gander-runtime
    paths:
      - 'gander/**'
      - 'modal/gander.py'
      - '.github/workflows/gander-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio fastapi httpx pillow pyyaml websockets modal
          python -m pip install --no-deps -e ./gander/minicpm_ft
          python -m pip install --no-deps -e ./gander/gander_runtime

      - name: Compile vendored runtime
        run: python -m compileall -q gander/gander_runtime/gander_runtime gander/minicpm_ft/mcpmft

      - name: Run Gander lifecycle and Ornith provider tests
        run: pytest -q gander/gander_runtime/tests

      - name: Validate Modal definition syntax
        env:
          GANDER_MODELS_VOLUME: placeholder-existing-volume
          GANDER_SECRET_NAME: placeholder-existing-secret
        run: python -m py_compile modal/gander.py

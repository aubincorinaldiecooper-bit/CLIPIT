name: Finish and validate SimpleMem migration

on:
  push:
    branches:
      - feat/simplemem-production
    paths:
      - src/**
      - test/**
      - package.json
      - package-lock.json
      - .env.example
      - scripts/finish-simplemem-migration.mjs
      - .github/workflows/complete-simplemem-migration.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Finish SimpleMem migration cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simplemem-production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply remaining cleanup
        run: node scripts/finish-simplemem-migration.mjs
      - run: npm ci
      - run: npm run typecheck
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: npm test 2>&1 | tee test-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simplemem-test-output
          path: test-output.txt
      - name: Stop on test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish SimpleMem migration cleanup"
          git push origin HEAD:feat/simplemem-production

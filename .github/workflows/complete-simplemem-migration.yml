name: Validate completed SimpleMem migration

on:
  push:
    branches:
      - feat/simplemem-production
    paths:
      - src/**
      - test/**
      - package.json
      - package-lock.json
      - .env.example
      - .github/workflows/complete-simplemem-migration.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simplemem-typecheck
          path: typecheck-output.txt
      - name: Fail on typecheck errors
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
      - run: npm test
